# Builds the Vite/React app and publishes the static `dist/` output to GitHub
# Pages on every push to main. Because the site uses hash-based routing
# (src/hooks/useHashRoute.ts) and a relative asset base (`base: './'` in
# vite.config.ts), no SPA 404 fallback is needed for the project-page subpath
# https://rshukla2.github.io/TaskTracker/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual re-deploys from the Actions tab.
  workflow_dispatch:

# Required so the deploy step can push to the GitHub Pages deployment endpoint.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel superseded in-progress runs so the latest push always wins.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the "node >= 20.19.0" engines field; 22 is the current LTS.
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
